<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Lounge — BidBoard</title>
<style>
  :root{
    --purple:#8b5cf6; --pink:#ec4899; --blue:#60a5fa;
    --rail-bg:#1c1533; --panel-bg:#ffffff; --panel-border:#e7e3f3;
    --text-dark:#232037; --text-mute:#8b869e;
    --topic-bg:#fdf3e4; --topic-text:#a8762c; --input-bg:#f4f2fa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; height:100vh; overflow:hidden; background:#fff; color:var(--text-dark);
  }
  .rail{
    width:56px; background:var(--rail-bg); display:flex; flex-direction:column; align-items:center;
    padding:18px 0; gap:6px; flex-shrink:0;
  }
  .rail .brand{
    width:34px; height:34px; border-radius:10px; margin-bottom:14px;
    background:linear-gradient(135deg, var(--purple), var(--pink));
    display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:15px;
  }
  .rail .ic{
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:17px; color:#b9b2d1; cursor:pointer; text-decoration:none;
  }
  .rail .ic.active{background:rgba(139,92,246,0.25); color:#fff;}
  .rail .ic:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .rail .spacer{flex:1;}

  .people{width:290px; background:var(--panel-bg); border-right:1px solid var(--panel-border); display:flex; flex-direction:column; flex-shrink:0;}
  .people-head{padding:16px 16px 10px; font-size:11px; font-weight:800; letter-spacing:0.1em; color:var(--text-mute);}
  .search{margin:0 16px 12px;}
  .search input{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--panel-border); background:#f7f6fb; font-size:13.5px;}
  .people-list{flex:1; overflow-y:auto; padding-bottom:12px;}
  .section-label{padding:14px 16px 6px; font-size:10.5px; font-weight:800; letter-spacing:0.1em; color:var(--text-mute); display:flex; align-items:center; gap:6px;}
  .section-label .sd{width:6px; height:6px; border-radius:50%; background:#34d399;}
  .person{display:flex; align-items:center; gap:10px; padding:7px 16px;}
  .person:hover{background:#f7f6fb;}
  .av{width:32px; height:32px; border-radius:50%; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff;}
  .av .os{position:absolute; bottom:-1px; right:-1px; width:9px; height:9px; border-radius:50%; border:2px solid #fff;}
  .av .os.on{background:#34d399;}
  .av .os.off{background:#c9c4d8;}
  .p-info{flex:1; min-width:0;}
  .p-name{font-size:13.5px; font-weight:700; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-status{font-size:11px; color:var(--text-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge-lv{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; color:#fff; flex-shrink:0;}
  .tag-badge{font-size:9px; font-weight:800; padding:1px 6px; border-radius:5px; margin-left:4px; white-space:nowrap;}
  .av-emoji{font-size:16px; background:none !important;}
  .line.whisper{background:#fdf3ff; border-radius:8px; padding:6px 10px; margin-left:-10px; border-left:3px solid #c86dd7;}
  .line.whisper .whisper-tag{font-size:10.5px; color:#a855c9; font-weight:700; margin-right:4px;}
  .cmd-notice{padding:6px 20px; font-size:12px; color:#6d3fc9; background:#f4effe; font-style:italic;}

  .nick-popup{
    position:fixed; z-index:200; background:#fff; border:1px solid #e7e3f3; border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.18); width:230px; padding:16px;
  }
  .nick-popup .np-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .nick-popup .np-avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:17px;}
  .nick-popup .np-name{font-weight:800; font-size:14.5px;}
  .nick-popup .np-badges{margin-top:2px;}
  .nick-popup .np-row{display:flex; gap:8px; margin-bottom:8px;}
  .nick-popup .np-btn{flex:1; padding:8px 0; border-radius:9px; border:1px solid #e7e3f3; background:#f7f6fb; font-size:12.5px; font-weight:700; cursor:pointer; text-align:center; color:#232037;}
  .nick-popup .np-btn.active{background:#efe9fe; color:#6d3fc9; border-color:#c9b8f5;}
  .nick-popup .np-stats{display:flex; justify-content:space-between; font-size:12px; color:#8b869e; margin-top:10px; padding-top:10px; border-top:1px solid #f0edf7;}

  .line{position:relative; cursor:pointer;}
  .line .msg-actions{display:none; gap:6px; margin-left:8px;}
  .line.selected .msg-actions{display:inline-flex;}
  .line .msg-actions span{font-size:12px; padding:2px 6px; border-radius:6px; color:#8b869e;}
  .line .msg-actions span:hover{background:#f0edf7; color:#5b4fd1;}
  .reply-chip{display:flex; align-items:center; gap:6px; background:#f4f2fa; border-left:3px solid #8b5cf6; border-radius:6px; padding:4px 10px; font-size:11.5px; color:#8b869e; margin-bottom:3px; max-width:60%;}
  .reaction-pills{display:inline-flex; gap:4px; margin-left:8px;}
  .reaction-pill{font-size:11px; background:#f4f2fa; border-radius:999px; padding:1px 7px;}
  .deleted-msg{color:#c3bfd1; font-style:italic;}
  .edited-tag{font-size:10px; color:#c3bfd1; margin-left:4px;}

  .mod-panel{
    position:fixed; top:0; right:-340px; width:320px; height:100vh; background:#fff;
    border-left:1px solid #e7e3f3; box-shadow:-10px 0 30px rgba(0,0,0,0.1); z-index:150;
    transition:right .25s ease; padding:20px; overflow-y:auto;
  }
  .mod-panel.open{right:0;}
  .mod-panel h3{font-size:13px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .mod-panel .close-x{cursor:pointer; color:#8b869e; font-size:16px;}
  .mod-user-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f4f2fa;}
  .mod-user-row .name{flex:1; font-size:13px; font-weight:700;}
  .mod-user-row button{font-size:10.5px; padding:4px 8px; border-radius:6px; border:none; background:#f4f2fa; color:#5b4fd1; cursor:pointer; margin-left:4px;}
  .mod-user-row button.danger{background:#fdeaea; color:#c0392b;}
  .lv-guest{background:#c4bfd6;} .lv-reg{background:#7cc576;} .lv-vip{background:#e0457a;} .lv-blue{background:#4a90d9;}

  .room{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topic-bar{background:var(--topic-bg); color:var(--topic-text); padding:12px 24px; font-size:13.5px; font-weight:600; border-bottom:1px solid #f0e2c8;}
  .log{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:2px;}
  .join-note{font-size:12.5px; color:var(--text-mute); margin:6px 0 14px; display:flex; align-items:center; gap:6px;}
  .line{padding:4px 0; font-size:15px; line-height:1.55; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .line .who{font-weight:800; flex-shrink:0;}
  .line .ts{margin-left:auto; font-size:11px; color:#c3bfd1; flex-shrink:0; padding-left:10px;}

  .composer{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--panel-border); background:var(--panel-bg);}
  .comp-ic{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; flex-shrink:0;}
  .comp-ic.rec{background:#fde8e8; color:#e14545;}
  .comp-ic.mute{background:#fde8e8; color:#e14545;}
  .comp-ic.call{background:#e14545; color:#fff;}
  .composer input{flex:1; padding:11px 16px; border-radius:10px; border:1px solid var(--panel-border); background:var(--input-bg); font-size:14.5px; font-family:inherit;}
  .composer input:focus{outline:none; border-color:var(--purple);}
  .send-btn{width:38px; height:38px; border-radius:10px; border:none; cursor:pointer; flex-shrink:0; background:linear-gradient(135deg, var(--purple), var(--blue)); color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center;}
  .frozen-tag{font-size:10.5px; background:#fff3d6; color:#a8762c; padding:3px 9px; border-radius:999px; font-weight:700;}
  .banner{padding:8px 24px; font-size:12.5px; background:#fdeaea; color:#c0392b;}
  .mention-banner{padding:8px 24px; font-size:12.5px; background:#f4effe; color:#6d3fc9; font-weight:700;}
  .line.mentioned{background:#f8f2ff; border-radius:8px; padding-left:8px; margin-left:-8px;}

  .rail-badge{
    position:absolute; top:2px; right:2px; background:#ec4899; color:#fff; font-size:9px; font-weight:800;
    border-radius:999px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .rail .ic{position:relative;}

  .above-composer{position:relative;}
  .emoji-toggle-row{display:flex; padding:6px 20px 0; gap:8px;}
  .emoji-btn{
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer; background:#f4f2fa; border:1px solid var(--panel-border);
  }
  .emoji-panel{
    position:absolute; bottom:100%; left:20px; margin-bottom:8px; width:280px;
    background:#fff; border:1px solid var(--panel-border); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.15);
    padding:12px; z-index:50; display:none;
  }
  .emoji-panel.open{display:block;}
  .emoji-tabs{display:flex; gap:8px; margin-bottom:10px;}
  .emoji-tab{padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--text-mute); background:#f4f2fa; cursor:pointer;}
  .emoji-tab.active{background:var(--purple); color:#fff;}
  .emoji-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; max-height:160px; overflow-y:auto;}
  .emoji-item{font-size:20px; cursor:pointer; text-align:center; padding:4px; border-radius:6px;}
  .emoji-item:hover{background:#f4f2fa;}
  @keyframes emoji-bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
  .emoji-anim{animation:emoji-bounce 0.9s ease-in-out infinite;}

  .people.collapsed{width:0; overflow:hidden; border-right:none;}
  .rail-collapse{margin-top:auto;}

  .mod-dots{padding:2px 6px; border-radius:6px; color:#8b869e; font-weight:800; cursor:pointer; flex-shrink:0;}
  .mod-dots:hover{background:#f0ecfd; color:#5b4fd1;}
  .mod-menu{
    position:absolute; background:#fff; border:1px solid #e7e3f3; border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,0.15); z-index:100; min-width:150px; overflow:hidden;
  }
  .mod-menu .item{padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; color:#232037;}
  .mod-menu .item:hover{background:#f4f2fa;}
  .mod-menu .item.danger{color:#c0392b;}
</style>
</head>
<body>

<div class="rail">
  <div class="brand">B</div>
  <a class="ic" title="Home (Main Chat)" href="chat-room.html">🏠</a>
  <div class="ic active" title="Rooms">👥</div>
  <a class="ic" title="Profile" href="profile.html">👤</a>
  <a class="ic" title="Private Messages" href="pm.html" id="pm-icon">✉️</a>
  <a class="ic" title="Settings" href="settings.html">⚙️</a>
  <a class="ic" title="Top Users" href="top-users.html">📊</a>
  <a class="ic" title="Most Loved" href="most-loved.html">🏆</a>
  <div class="ic" title="Room Control" id="mod-tab-icon" style="display:none;" onclick="toggleModPanel()">🛠️</div>
  <div class="spacer"></div>
  <a class="ic" title="Help" href="help.html">❓</a>
  <div class="ic" title="Log out" onclick="Session.clear(); window.location.href='index.html';">🚪</div>
  <div class="ic rail-collapse" title="Show/hide people list" id="collapse-toggle">⏴</div>
</div>

<div class="people">
  <div class="people-head">PEOPLE</div>
  <div class="search"><input type="text" id="search-users" placeholder="Search users..."></div>
  <div class="people-list" id="people-list"><div style="padding:16px; color:#8b869e; font-size:13px;">Loading…</div></div>
</div>

<div class="room">
  <div class="topic-bar">🏷️ Topic: <b>General Lounge — talk about anything, be decent about it</b></div>
  <div id="banner"></div>
  <div class="mention-banner" id="mention-banner" style="display:none;"></div>
  <div class="log" id="log"></div>
  <div class="above-composer">
    <div class="emoji-panel" id="emoji-panel"></div>
    <div class="emoji-toggle-row">
      <div class="emoji-btn" id="emoji-toggle" title="Emojis">😊</div>
    </div>
    <div class="composer">
      <div class="comp-ic rec">●</div>
      <div class="comp-ic mute">🎤</div>
      <div class="comp-ic call" id="call-btn" title="Start a call">📞</div>
      <input type="text" id="msg-input" placeholder="Message…">
      <span class="frozen-tag" id="frozen-tag" style="display:none;">Scroll frozen</span>
      <button class="send-btn" id="send-btn">➤</button>
    </div>
  </div>
</div>

<div class="mod-panel" id="mod-panel">
  <h3>🛠️ ROOM CONTROL <span class="close-x" onclick="toggleModPanel()">✕</span></h3>
  <div id="mod-panel-users">Loading…</div>
</div>

<script src="api.js"></script>
<script src="emoji-picker.js"></script>
<script src="call-webrtc.js"></script>
<script>
const session = Session.requireLogin();
let me = null;
let lastMsgId = 0;
let allUsers = [];
let myPowers = { canModerate: false, canChangeLevel: false, capabilities: [] };
const ROOM = urlParam('room') || '';

function levelBadgeClass(u){
  if(u.likes >= 300) return 'lv-vip';
  if(u.level >= 50) return 'lv-blue';
  if(u.level > 1) return 'lv-reg';
  return 'lv-guest';
}

function renderPeople(users, filter=''){
  const list = document.getElementById('people-list');
  const f = filter.trim().toLowerCase();
  const shown = users.filter(u => u.username.toLowerCase().includes(f));
  const registered = shown.filter(u => !u.isGuest);
  const guests = shown.filter(u => u.isGuest);

  function row(u){
    const you = me && u.username === me.username;
    const showMod = myPowers.canModerate && !you;
    const emoji = resolveAvatarEmoji(u.avatarEmoji);
    const avatarContent = emoji || initials(u.username);
    return `<div class="person" style="cursor:pointer;" onclick="${you? '' : `openNickPopup(event, '${u.username}')`}">
      <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
        <div class="av ${emoji?'av-emoji':''}" style="background:${emoji? 'transparent' : colorFor(u.username)}">${avatarContent}<span class="os ${u.online?'on':'off'}"></span></div>
        <div class="p-info">
          <div class="p-name">${u.username}${you?' (you)':''}${renderBadges(u.tags)}</div>
          ${u.statusMessage? `<div class="p-status">${u.statusMessage}</div>`:''}
        </div>
      </div>
      <span class="badge-lv ${levelBadgeClass(u)}">LV.${u.level}</span>
      ${showMod ? `<span class="mod-dots" onclick="event.stopPropagation(); toggleModMenu(this,'${u.username}')">⋯</span>` : ''}
    </div>`;
  }

  let html = '';
  html += `<div class="section-label"><span class="sd"></span> REGISTERED (${registered.length})</div>`;
  html += registered.map(row).join('') || '<div style="padding:6px 16px; font-size:12px; color:#c3bfd1;">No one yet</div>';
  html += `<div class="section-label"><span class="sd"></span> GUESTS (${guests.length})</div>`;
  html += guests.map(row).join('') || '<div style="padding:6px 16px; font-size:12px; color:#c3bfd1;">No one yet</div>';
  list.innerHTML = html;
}

function addLine(msg){
  const log = document.getElementById('log');
  const time = new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const div = document.createElement('div');
  div.dataset.msgId = msg.id;
  const mentionedMe = me && Array.isArray(msg.mentions) && msg.mentions.some(m => m.toLowerCase() === me.username.toLowerCase());
  const isWhisper = !!msg.whisperTo;
  div.className = 'line' + (mentionedMe ? ' mentioned' : '') + (isWhisper ? ' whisper' : '');

  const whisperTag = isWhisper
    ? (msg.username === me.username
        ? `<span class="whisper-tag">🤫 whisper to ${msg.whisperTo}</span>`
        : `<span class="whisper-tag">🤫 whisper</span>`)
    : '';

  const replyChip = msg.replyTo
    ? `<div class="reply-chip">↩ <b>${msg.replyTo.username}</b>: ${substituteEmojiCodes((msg.replyTo.text||'').slice(0,60).replace(/</g,'&lt;'))}</div>`
    : '';

  const isMine = me && msg.username === me.username;
  const canModDelete = myPowers.capabilities && (myPowers.capabilities.includes('clear') || myPowers.capabilities.includes('ban'));
  const bodyHtml = msg.deleted
    ? `<span class="txt deleted-msg">[message deleted]</span>`
    : `<span class="txt">${substituteEmojiCodes(msg.text.replace(/</g,'&lt;'))}</span>${msg.edited ? '<span class="edited-tag">(edited)</span>' : ''}`;

  const reactionPills = Object.keys(msg.reactionSummary || {}).map(r =>
    `<span class="reaction-pill">${r} ${msg.reactionSummary[r]}</span>`
  ).join('');

  const actions = !msg.deleted ? `
    <span class="msg-actions">
      <span onclick="event.stopPropagation(); startReply(${msg.id}, '${msg.username}')">↩ Reply</span>
      <span onclick="event.stopPropagation(); openReactionPicker(event, ${msg.id})">😀 React</span>
      ${isMine ? `<span onclick="event.stopPropagation(); startEditMessage(${msg.id})">✏️ Edit</span>` : ''}
      ${(isMine || canModDelete) ? `<span onclick="event.stopPropagation(); deleteMessageLine(${msg.id})">🗑️ Delete</span>` : ''}
    </span>
  ` : '';

  div.innerHTML = `${replyChip}${whisperTag}<span class="who" style="color:${msg.fontColor || colorFor(msg.username)}; font-family:${msg.fontFamily || 'inherit'}">${msg.username}:</span>
    ${bodyHtml}<span class="reaction-pills">${reactionPills}</span>
    <span class="ts">${time}</span>
    ${actions}`;

  div.addEventListener('click', () => {
    document.querySelectorAll('.line.selected').forEach(el => { if(el !== div) el.classList.remove('selected'); });
    div.classList.toggle('selected');
  });

  log.appendChild(div);
  if(!me || me.scrollMode !== 'freeze'){
    log.scrollTop = log.scrollHeight;
  }
  if(mentionedMe && msg.username !== me.username){
    showMentionBanner(`🔔 ${msg.username} mentioned you`);
  }
}

let replyingToId = null;
let editingMessageId = null;

function startReply(messageId, username){
  replyingToId = messageId;
  editingMessageId = null;
  const input = document.getElementById('msg-input');
  input.placeholder = `Replying to ${username}...`;
  input.focus();
  showCommandHint(`Replying to ${username} — send your message, or press Esc to cancel.`);
}

function startEditMessage(messageId){
  const line = document.querySelector(`[data-msg-id="${messageId}"]`);
  if(!line) return;
  const currentText = line.querySelector('.txt').textContent;
  const input = document.getElementById('msg-input');
  input.value = currentText;
  editingMessageId = messageId;
  replyingToId = null;
  input.placeholder = 'Editing message — press Enter to save, Esc to cancel...';
  input.focus();
}

function cancelReplyOrEdit(){
  replyingToId = null;
  editingMessageId = null;
  document.getElementById('msg-input').placeholder = 'Message…';
}

function showCommandHint(text){
  addCommandNotice(text);
}

async function deleteMessageLine(messageId){
  if(!confirm('Delete this message?')) return;
  const result = await api(`/messages/${messageId}`, { method:'DELETE' });
  if(result.error){ showBanner(result.error); return; }
  const line = document.querySelector(`[data-msg-id="${messageId}"]`);
  if(line){
    line.classList.remove('selected');
    line.querySelector('.txt') && (line.querySelector('.txt').outerHTML = '<span class="txt deleted-msg">[message deleted]</span>');
    const actionsEl = line.querySelector('.msg-actions');
    if(actionsEl) actionsEl.remove();
  }
}

function openReactionPicker(evt, messageId){
  evt.stopPropagation();
  const existing = document.getElementById('reaction-picker');
  if(existing) existing.remove();
  const rect = evt.currentTarget.getBoundingClientRect();
  const picker = document.createElement('div');
  picker.id = 'reaction-picker';
  picker.style.cssText = `position:fixed; top:${rect.bottom+4}px; left:${rect.left}px; background:#fff; border:1px solid #e7e3f3; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.15); padding:8px; z-index:300; display:flex; gap:4px;`;
  ['👍','👎','❤️','😂','😮','😢'].forEach(emoji => {
    const span = document.createElement('span');
    span.textContent = emoji;
    span.style.cssText = 'cursor:pointer; font-size:18px; padding:2px 4px;';
    span.addEventListener('click', async () => {
      await api(`/messages/${messageId}/react`, { method:'POST', body:{ reaction: emoji } });
      picker.remove();
      await pollMessages();
    });
    picker.appendChild(span);
  });
  document.body.appendChild(picker);
  setTimeout(() => document.addEventListener('click', function closeOnce(e){
    if(!picker.contains(e.target)){ picker.remove(); document.removeEventListener('click', closeOnce); }
  }), 0);
}

function addCommandNotice(text){
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'cmd-notice';
  div.textContent = text;
  log.appendChild(div);
  if(!me || me.scrollMode !== 'freeze'){
    log.scrollTop = log.scrollHeight;
  }
}

function showMentionBanner(text){
  const el = document.getElementById('mention-banner');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(window._mentionTimer);
  window._mentionTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function refreshUsers(){
  const result = await api(`/users?roomId=${ROOM}`);
  if(result.users){
    allUsers = result.users;
    renderPeople(allUsers, document.getElementById('search-users').value);
  }
}

async function pollMessages(){
  const result = await api(`/messages?room=${ROOM}&since=${lastMsgId}`);
  if(result.messages && result.messages.length){
    result.messages.forEach(m => { addLine(m); lastMsgId = m.id; });
  }
}

async function sendHeartbeat(){
  const result = await api('/heartbeat', { method:'POST', body:{ roomId: ROOM } });
  if(result.user) me = result.user;
}

function showBanner(msg){
  document.getElementById('banner').innerHTML = `<div class="banner">${msg}</div>`;
}

async function init(){
  if(!ROOM){
    const roomResult = await api('/rooms/default');
    if(roomResult.id){
      window.location.href = `chat-room.html?room=${roomResult.id}`;
      return;
    }
  }
  const profileResult = await api('/profile');
  if(profileResult.error){ Session.clear(); window.location.href = 'index.html'; return; }
  me = profileResult.user;
  connectCallSignaling(session.token);
  const powersResult = await api('/mod/my-powers');
  if(!powersResult.error) myPowers = powersResult;
  if(myPowers.canModerate) document.getElementById('mod-tab-icon').style.display = 'flex';
  document.getElementById('msg-input').placeholder = `Message as ${me.username}...`;
  document.getElementById('frozen-tag').style.display = me.scrollMode === 'freeze' ? 'inline-block' : 'none';

  const roomInfo = await fetch(`${API_BASE}/rooms/${ROOM}/public`).then(r => r.json()).catch(() => null);
  if(roomInfo && roomInfo.room){
    document.querySelector('.topic-bar').innerHTML = `🏷️ Topic: <b>${roomInfo.room.topic}</b>`;
    document.title = `${roomInfo.room.name} — BidBoard`;
  }

  await refreshUsers();
  await pollMessages();

  setInterval(refreshUsers, 5000);
  setInterval(pollMessages, 2500);
  setInterval(sendHeartbeat, 20000);
  sendHeartbeat();
}
init();

document.getElementById('search-users').addEventListener('input', e => renderPeople(allUsers, e.target.value));

async function sendCurrentMessage(){
  const input = document.getElementById('msg-input');
  const val = input.value.trim();
  if(!val) return;

  if(editingMessageId){
    const result = await api(`/messages/${editingMessageId}`, { method:'PATCH', body:{ text: val } });
    input.value = '';
    cancelReplyOrEdit();
    if(result.error){ showBanner(result.error); return; }
    await pollMessages();
    return;
  }

  input.value = '';
  const body = { room: ROOM, text: val };
  if(replyingToId) body.replyToId = replyingToId;
  const result = await api('/messages', { method:'POST', body });
  cancelReplyOrEdit();
  if(result.error){ showBanner(result.error); return; }
  if(result.notice){ addCommandNotice(result.notice); return; }
  await pollMessages();
}
document.getElementById('send-btn').addEventListener('click', sendCurrentMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') sendCurrentMessage();
  if(e.key === 'Escape'){ document.getElementById('msg-input').value = ''; cancelReplyOrEdit(); }
});

// --- Emoji picker ---
const emojiPanel = document.getElementById('emoji-panel');
buildEmojiPicker(emojiPanel, (emoji) => {
  const input = document.getElementById('msg-input');
  input.value += emoji;
  input.focus();
});
document.getElementById('emoji-toggle').addEventListener('click', (e) => {
  e.stopPropagation();
  emojiPanel.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if(!emojiPanel.contains(e.target) && e.target.id !== 'emoji-toggle'){
    emojiPanel.classList.remove('open');
  }
});

// --- Call button (1:1 calls via WebRTC) ---
document.getElementById('call-btn').addEventListener('click', () => {
  const target = prompt('Call who? Type their username (calls are 1:1 for now):');
  if(target && target.trim()) openCallModal(target.trim(), 'audio');
});

// --- Collapse / expand the People panel ---
document.getElementById('collapse-toggle').addEventListener('click', function(){
  const panel = document.querySelector('.people');
  panel.classList.toggle('collapsed');
  this.textContent = panel.classList.contains('collapsed') ? '⏵' : '⏴';
});

// --- PM unread badge on the rail ---
async function refreshPmBadge(){
  const result = await api('/pms/unread-count');
  const icon = document.getElementById('pm-icon');
  const existing = icon.querySelector('.rail-badge');
  if(existing) existing.remove();
  if(result.count > 0){
    const b = document.createElement('span');
    b.className = 'rail-badge';
    b.textContent = result.count > 9 ? '9+' : result.count;
    icon.appendChild(b);
  }
}
refreshPmBadge();
setInterval(refreshPmBadge, 6000);

// --- In-room admin/mod control panel ---
async function toggleModPanel(){
  const panel = document.getElementById('mod-panel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) await loadModPanel();
}

async function loadModPanel(){
  const container = document.getElementById('mod-panel-users');
  const result = await api(`/users?roomId=${ROOM}`);
  const users = (result.users || []).filter(u => u.username !== me.username);
  if(!users.length){ container.innerHTML = '<div style="color:var(--text-mute); font-size:13px;">No one else is here.</div>'; return; }
  container.innerHTML = users.map(u => `
    <div class="mod-user-row">
      <span class="name">${u.username}${u.muted?' 🔇':''}${u.banned?' 🚫':''}</span>
      <button onclick="modActionFromPanel('mute','${u.username}')">Mute</button>
      <button onclick="modActionFromPanel('kick','${u.username}')" class="danger">Kick</button>
      <button onclick="modActionFromPanel('ban','${u.username}')" class="danger">Ban</button>
    </div>
  `).join('');
}

async function modActionFromPanel(action, username){
  let result;
  if(action === 'mute') result = await api('/mod/mute', { method:'POST', body:{ targetUsername: username, muted: true } });
  if(action === 'kick') result = await api('/mod/kick', { method:'POST', body:{ targetUsername: username } });
  if(action === 'ban'){
    if(!confirm(`Ban ${username} from this room?`)) return;
    result = await api('/mod/ban', { method:'POST', body:{ targetUsername: username, roomId: ROOM } });
  }
  if(result && result.error){ showBanner(result.error); return; }
  loadModPanel();
  refreshUsers();
}

// --- Nick-click popup card ---
function closeNickPopup(){
  const existing = document.getElementById('nick-popup');
  if(existing) existing.remove();
}

async function openNickPopup(evt, username){
  evt.stopPropagation();
  closeNickPopup();
  closeModMenu();

  const rect = evt.currentTarget.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.id = 'nick-popup';
  popup.className = 'nick-popup';
  popup.style.top = (rect.top + window.scrollY) + 'px';
  popup.style.left = (rect.right + window.scrollX + 10) + 'px';
  popup.innerHTML = `<div style="text-align:center; color:#8b869e; font-size:12px; padding:10px 0;">Loading…</div>`;
  document.body.appendChild(popup);

  const result = await api(`/users/${encodeURIComponent(username)}/public`);
  if(result.error){ popup.innerHTML = `<div style="color:#c0392b; font-size:12px;">${result.error}</div>`; return; }
  const p = result.profile;
  const ignoreInfo = await api('/ignore-info');
  const isIgnoring = ignoreInfo.ignoring && ignoreInfo.ignoring.includes(username);
  const emoji = resolveAvatarEmoji(p.avatarEmoji);

  popup.innerHTML = `
    <div class="np-head">
      <div class="np-avatar" style="background:${emoji?'transparent':colorFor(p.username)}">${emoji || initials(p.username)}</div>
      <div>
        <div class="np-name">${p.username}</div>
        <div class="np-badges">${renderBadges(p.tags)}</div>
      </div>
    </div>
    <div class="np-row">
      <div class="np-btn" onclick="reactToUser('${p.username}','like')">👍 <span id="np-likes">${p.likes}</span></div>
      <div class="np-btn" onclick="reactToUser('${p.username}','dislike')">👎 <span id="np-dislikes">${p.dislikes}</span></div>
    </div>
    <div class="np-row">
      <div class="np-btn" onclick="window.location.href='pm.html?user=${encodeURIComponent(p.username)}'">💬 Message</div>
      <div class="np-btn" onclick="window.location.href='view-profile.html?user=${encodeURIComponent(p.username)}'">👤 Profile</div>
    </div>
    <div class="np-btn ${isIgnoring?'active':''}" style="width:100%;" onclick="toggleIgnoreUser('${p.username}', this)">${isIgnoring? '✓ Ignoring' : '🚫 Ignore'}</div>
    <div class="np-stats"><span>LV.${p.level}</span><span>${p.points} pts</span></div>
  `;
}

async function reactToUser(username, type){
  await api('/react', { method:'POST', body:{ targetUsername: username, type } });
  closeNickPopup();
}

async function toggleIgnoreUser(username, btn){
  const result = await api('/ignore', { method:'POST', body:{ targetUsername: username } });
  if(result.error){ showBanner(result.error); return; }
  btn.textContent = result.ignoring ? '✓ Ignoring' : '🚫 Ignore';
  btn.classList.toggle('active', result.ignoring);
  refreshUsers();
}

document.addEventListener('click', (e) => {
  if(!e.target.closest('.nick-popup') && !e.target.closest('.person')) closeNickPopup();
});

// --- Tag-based moderation menu (owner/admin/etc.) ---
function closeModMenu(){
  const existing = document.getElementById('mod-menu');
  if(existing) existing.remove();
}

function toggleModMenu(el, username){
  const already = document.getElementById('mod-menu');
  closeModMenu();
  if(already && already.dataset.for === username) return; // clicked same dots twice -> just close

  const rect = el.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.id = 'mod-menu';
  menu.className = 'mod-menu';
  menu.dataset.for = username;
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = (rect.left + window.scrollX - 110) + 'px';

  let items = `
    <div class="item" onclick="modAction('mute','${username}')">🔇 Mute</div>
    <div class="item" onclick="modAction('unmute','${username}')">🔈 Unmute</div>
    <div class="item danger" onclick="modAction('kick','${username}')">👢 Kick</div>
    <div class="item danger" onclick="modAction('ban','${username}')">🚫 Ban from room</div>
  `;
  if(myPowers.canChangeLevel){
    items += `<div class="item" onclick="modAction('setlevel','${username}')">⭐ Change Level</div>`;
  }
  menu.innerHTML = items;
  document.body.appendChild(menu);
}

document.addEventListener('click', (e) => {
  if(!e.target.closest('.mod-menu') && !e.target.closest('.mod-dots')) closeModMenu();
});

async function modAction(action, username){
  closeModMenu();
  let result;
  if(action === 'mute') result = await api('/mod/mute', { method:'POST', body:{ targetUsername: username, muted: true } });
  if(action === 'unmute') result = await api('/mod/mute', { method:'POST', body:{ targetUsername: username, muted: false } });
  if(action === 'kick') result = await api('/mod/kick', { method:'POST', body:{ targetUsername: username } });
  if(action === 'ban'){
    if(!confirm(`Ban ${username} from this room?`)) return;
    result = await api('/mod/ban', { method:'POST', body:{ targetUsername: username, roomId: ROOM } });
  }
  if(action === 'setlevel'){
    const level = prompt(`New level for ${username}:`, '1');
    if(level === null) return;
    result = await api('/mod/setlevel', { method:'POST', body:{ targetUsername: username, level: Number(level) } });
  }
  if(result && result.error){ showBanner(result.error); return; }
  refreshUsers();
}
</script>
