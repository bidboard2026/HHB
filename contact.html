<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — BidBoard</title>
<link rel="stylesheet" href="style.css">
<style>
  .contact-wrap{
    max-width:640px; margin:0 auto; padding:20px 48px 100px;
  }
</style>
</head>
<body>

<header class="site">
  <a class="logo" href="index.html">BidBoard</a>
  <nav class="main">
    <a href="all-rooms.html">All Rooms</a>
    <a href="trending-rooms.html">Trending Rooms</a>
    <a href="voice-rooms.html">Voice Rooms</a>
    <a href="free-chat-room.html">Free Chat Room</a>
  </nav>
</header>

<section class="page-hero">
  <h1><span class="g1">Get in Touch</span></h1>
  <p>Questions, a report about someone's behavior, or a bug you've spotted — send it over and our small team will get back to you.</p>
</section>

<div class="contact-wrap">
  <div class="card">
    <form onsubmit="return false;">
      <div class="field">
        <label>Name</label>
        <input type="text" placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Message</label>
        <textarea placeholder="What's going on?"></textarea>
      </div>
      <button class="cta" type="submit">Send Message</button>
    </form>
  </div>
</div>

<footer class="site">
  <div class="fl">Bid<span>Board</span> — chat since today.</div>
  <div class="flinks">
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>
  <div class="copy">© 2026 BidBoard.</div>
</footer>

</body>
</html>
